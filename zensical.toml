# zensical.toml
# Configuración de la documentación de AppForge.
# Referencia: https://zensical.org/docs/setup/basics/
#
#   uv run --group docs zensical serve   # vista previa en http://localhost:8000
#   uv run --group docs zensical build   # genera el sitio estático en site/

[project]
site_name = "AppForge"
site_description = "Recetas de configuración repetibles desde un menú de consola."
# GitHub Pages distingue mayúsculas en la ruta: debe coincidir con el nombre del repo.
site_url = "https://isidro-rodriguez.github.io/appforge/"
repo_url = "https://github.com/isidro-rodriguez/appforge"
repo_name = "isidro-rodriguez/appforge"
edit_uri = "edit/main/docs/"
copyright = "AppForge · Licencia MIT"
docs_dir = "docs"
site_dir = "site"
extra_css = ["assets/stylesheets/appforge.css"]

# Orden de lectura explícito: primero el uso, después el desarrollo.
nav = [
    { "Inicio" = "index.md" },
    { "Guía" = [
        { "Primeros pasos" = "guia/primeros-pasos.md" },
        { "Interfaz" = "guia/interfaz.md" },
        { "Línea de comandos" = "guia/cli.md" },
        { "Recetas incluidas" = "guia/recetas.md" },
    ] },
    { "Uso avanzado" = [
        { "Configuración" = "avanzado/configuracion.md" },
        { "Qué pasa al aplicar" = "avanzado/ejecucion.md" },
        { "Seguridad" = "avanzado/seguridad.md" },
        { "Solución de problemas" = "avanzado/problemas.md" },
    ] },
    { "Desarrollo" = [
        { "Crear una receta" = "desarrollo/nueva-entrada.md" },
        { "Formato de las recetas" = "desarrollo/formato.md" },
        { "Buenas prácticas" = "desarrollo/buenas-practicas.md" },
        { "Probar una receta" = "desarrollo/probar.md" },
        { "Arquitectura" = "desarrollo/arquitectura.md" },
        { "Contribuir" = "desarrollo/contribuir.md" },
        { "Empaquetado y publicación" = "desarrollo/empaquetado.md" },
        { "Referencia de la API" = "desarrollo/api.md" },
    ] },
    { "Cambios" = "changelog.md" },
]

[project.theme]
language = "es"
# Plantillas propias: favicons y manifiesto web (`docs_templates/main.html`).
custom_dir = "docs_templates"
favicon = "assets/images/favicon.png"
logo = "assets/images/logo.png"
font.text = "Source Sans 3"
font.code = "Source Code Pro"
features = [
    "content.action.edit",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.tabs",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

# Los colores reales (paleta de theme.py) están en `docs/assets/stylesheets/appforge.css`.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Cambiar a modo claro"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Cambiar a modo oscuro"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Cambiar a la preferencia del sistema"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/isidro-rodriguez/appforge"
name = "Código fuente en GitHub"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
# Anclajes con tildes, igual que GitHub: los enlaces `#validación` funcionan en
# la web y al leer los .md en el repositorio.
toc.slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# Para incluir CHANGELOG.md en docs/changelog.md.
pymdownx.snippets = { base_path = ["."], check_paths = true }
pymdownx.superfences.custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

# Referencia de la API desde los docstrings (estilo Google, en español).
[project.plugins.mkdocstrings]
custom_templates = "docs_templates"
locale = "es"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_root_heading = false
show_source = false
show_signature_annotations = true
separate_signature = true
members_order = "source"
merge_init_into_class = true
show_if_no_docstring = false
heading_level = 3
