{% extends "base.html" %}

{#- Favicons y manifiesto web. Las rutas son relativas para funcionar bajo
    /appforge/ en GitHub Pages. -#}
{% block extrahead %}
<link rel="apple-touch-icon"
      sizes="180x180"
      href="{{ 'assets/favicon/apple-touch-icon.png' | url }}">
<link rel="icon"
      type="image/png"
      sizes="32x32"
      href="{{ 'assets/favicon/favicon-32x32.png' | url }}">
<link rel="icon"
      type="image/png"
      sizes="16x16"
      href="{{ 'assets/favicon/favicon-16x16.png' | url }}">
<link rel="manifest" href="{{ 'site.webmanifest' | url }}">
<meta name="theme-color" content="#14171b">
{% endblock %}
