# .github/workflows/release.yml
# Construye el paquete .deb de AppForge, lo prueba en un Debian 13 limpio y lo
# publica con SHA256SUMS y procedencia (attestation) de GitHub.
# - Etiqueta vX.Y.Z → publica la Release.
# - Ejecución manual → deja el paquete como artefacto; con «publish» en main,
#   además crea la etiqueta vX.Y.Z (versión de pyproject.toml) y la Release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Crear la etiqueta vX.Y.Z (versión de pyproject.toml) y publicar la Release"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Construir .deb (amd64)
    runs-on: ubuntu-latest
    # Objetivo: Debian estable actual. Se compila en su contenedor porque el
    # binario enlaza con la glibc de donde se construye (ubuntu-latest es más nueva).
    container: debian:trixie-slim
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Dependencias del sistema (objdump para PyInstaller, git)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends binutils ca-certificates git

      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar uv y Python
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.x"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"

      - name: Versión de pyproject.toml (y coincidencia con la etiqueta)
        id: version
        run: |
          version="$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no es v$version"; exit 1
          fi

      - name: Sincronizar dependencias
        run: uv sync --locked

      - name: Construir binario y paquete
        run: uv run python scripts/build.py

      - name: Subir el paquete como artefacto
        uses: actions/upload-artifact@v5
        with:
          name: appforge-deb
          path: |
            dist/appforge_*.deb
            dist/SHA256SUMS
          if-no-files-found: error

  test:
    name: Probar en Debian 13 limpio
    needs: build
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      - name: Descargar el paquete
        uses: actions/download-artifact@v5
        with:
          name: appforge-deb
          path: dist

      - name: Instalar (con páginas man, que la imagen slim excluye)
        run: |
          rm -f /etc/dpkg/dpkg.cfg.d/docker
          cd dist && sha256sum -c SHA256SUMS && cd ..
          apt-get update
          apt-get install -y --no-install-recommends man-db desktop-file-utils ./dist/appforge_*.deb

      - name: Comprobar la instalación, reinstalar, desinstalar y purgar
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          fail=0
          # check "descripción" 'orden': anota en la ejecución lo que falle.
          check() {
            if ! out="$(bash -c "$2" 2>&1)"; then
              echo "::error title=Falla la comprobación::$1"
              printf '%s\n' "--- $1 ---" "$out"
              fail=1
            fi
          }
          set +e
          check "versión" 'appforge --version | grep -F "$VERSION"'
          check "enlace /usr/bin" 'test "$(readlink /usr/bin/appforge)" = /opt/appforge/appforge'
          check "validate" 'appforge validate --strict'
          check "man" 'MANWIDTH=120 man -P cat appforge | grep -q "ESTADO DE SALIDA"'
          check "desktop" 'desktop-file-validate /usr/share/applications/appforge.desktop'
          check "propietario root" 'test -z "$(find /opt/appforge /etc/appforge ! -user root)"'
          check "permisos" 'test -z "$(find /opt/appforge /etc/appforge -perm /022 ! -type l)"'
          check "sin terminal" 'rc=0; appforge >/tmp/o 2>&1 || rc=$?; cat /tmp/o; test "$rc" = 2 && grep -q terminal /tmp/o'
          check "sin root" 'rc=0; setpriv --reuid=nobody --regid=nogroup --clear-groups appforge >/tmp/o 2>&1 || rc=$?; cat /tmp/o; test "$rc" = 2 && grep -q superusuario /tmp/o'
          echo "# cambio local" >> /etc/appforge/config.toml
          check "reinstalar" 'apt-get install -y --reinstall ./dist/appforge_*.deb'
          check "conffile respetado" 'grep -q "cambio local" /etc/appforge/config.toml'
          check "desinstalar" 'apt-get remove -y appforge && test ! -e /opt/appforge && test ! -e /usr/bin/appforge'
          check "remove conserva config" 'test -f /etc/appforge/config.toml'
          check "purgar" 'apt-get purge -y appforge && test ! -e /etc/appforge && test ! -e /var/log/appforge'
          exit "$fail"

  release:
    name: Publicar Release
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: v${{ needs.build.outputs.version }}
    steps:
      - name: Checkout (para las notas del CHANGELOG)
        uses: actions/checkout@v7

      - name: Notas de la versión desde CHANGELOG.md
        run: |
          awk -v v="${TAG#v}" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "Versión $TAG." > notes.md

      - name: Descargar el paquete
        uses: actions/download-artifact@v5
        with:
          name: appforge-deb
          path: dist

      - name: Procedencia del paquete (attestation)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/appforge_*.deb

      - name: Crear la Release con el paquete
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Si la etiqueta no existe (ejecución manual), se crea sobre este commit.
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AppForge $TAG" \
            --notes-file notes.md
