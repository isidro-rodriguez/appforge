# .github/workflows/release.yml
# Empaqueta AppForge (binario + config.toml + entries/) en un .tar.gz.
# - Etiqueta vX.Y.Z → publica el paquete en una Release de GitHub.
# - Ejecución manual → deja el paquete como artefacto de la ejecución; con
#   «publish» en main, además crea la etiqueta vX.Y.Z (versión de pyproject.toml)
#   sobre ese commit y su Release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Crear la etiqueta vX.Y.Z (versión de pyproject.toml) y publicar la Release"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Empaquetar (linux-x86_64)
    runs-on: ubuntu-latest
    # Objetivo: Debian estable actual. Se compila en su contenedor porque el
    # binario enlaza con la glibc de donde se construye (ubuntu-latest es más nueva).
    container: debian:trixie-slim
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Dependencias del sistema (objdump para PyInstaller, git, tar)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends binutils ca-certificates git

      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar uv y Python
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.x"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"

      - name: Versión de pyproject.toml (y coincidencia con la etiqueta)
        id: version
        run: |
          version="$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no es v$version"; exit 1
          fi

      - name: Sincronizar dependencias
        run: uv sync --locked

      - name: Construir binario y paquete
        run: uv run python scripts/build.py --archive

      - name: Probar el binario empaquetado
        run: |
          mkdir -p /tmp/smoke
          tar -xzf dist/appforge-*.tar.gz -C /tmp/smoke
          /tmp/smoke/appforge/appforge --version
          /tmp/smoke/appforge/appforge validate --strict

      - name: Subir el paquete como artefacto
        uses: actions/upload-artifact@v5
        with:
          name: appforge-linux-x86_64
          path: |
            dist/appforge-*.tar.gz
            dist/appforge-*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publicar Release
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: v${{ needs.build.outputs.version }}
    steps:
      - name: Checkout (para las notas del CHANGELOG)
        uses: actions/checkout@v7

      - name: Notas de la versión desde CHANGELOG.md
        run: |
          awk -v v="${TAG#v}" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "Versión $TAG." > notes.md

      - name: Descargar el paquete
        uses: actions/download-artifact@v5
        with:
          name: appforge-linux-x86_64
          path: dist

      - name: Crear la Release con el paquete
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Si la etiqueta no existe (ejecución manual), se crea sobre este commit.
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AppForge $TAG" \
            --notes-file notes.md
