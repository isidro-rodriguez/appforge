# .github/workflows/release.yml
# Construye el paquete .deb de AppForge, lo prueba en un Debian 13 limpio y lo
# publica con SHA256SUMS y procedencia (attestation) de GitHub.
# - Etiqueta vX.Y.Z → publica la Release.
# - Ejecución manual → deja el paquete como artefacto; con «publish» en main,
#   además crea la etiqueta vX.Y.Z (versión de pyproject.toml) y la Release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Crear la etiqueta vX.Y.Z (versión de pyproject.toml) y publicar la Release"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Construir .deb (amd64)
    runs-on: ubuntu-latest
    # Objetivo: Debian estable actual. Se compila en su contenedor porque el
    # binario enlaza con la glibc de donde se construye (ubuntu-latest es más nueva).
    container: debian:trixie-slim
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Dependencias del sistema (objdump para PyInstaller, git)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends binutils ca-certificates git

      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar uv y Python
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.x"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"

      - name: Versión de pyproject.toml (y coincidencia con la etiqueta)
        id: version
        run: |
          version="$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no es v$version"; exit 1
          fi

      - name: Sincronizar dependencias
        run: uv sync --locked

      - name: Construir binario y paquete
        run: uv run python scripts/build.py

      - name: Subir el paquete como artefacto
        uses: actions/upload-artifact@v5
        with:
          name: appforge-deb
          path: |
            dist/appforge_*.deb
            dist/SHA256SUMS
          if-no-files-found: error

  test:
    name: Probar en Debian 13 limpio
    needs: build
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      - name: Descargar el paquete
        uses: actions/download-artifact@v5
        with:
          name: appforge-deb
          path: dist

      - name: Instalar (con páginas man, que la imagen slim excluye)
        run: |
          rm -f /etc/dpkg/dpkg.cfg.d/docker
          cd dist && sha256sum -c SHA256SUMS && cd ..
          apt-get update
          apt-get install -y --no-install-recommends man-db desktop-file-utils ./dist/appforge_*.deb

      - name: Comprobar la instalación
        run: |
          set -x
          appforge --version | grep -F "${{ needs.build.outputs.version }}"
          test "$(readlink /usr/bin/appforge)" = /opt/appforge/appforge
          appforge validate --strict
          man -P cat appforge | grep -q "recetas de configuración"
          desktop-file-validate /usr/share/applications/appforge.desktop
          # Todo de root y sin escritura para grupo u otros.
          test -z "$(find /opt/appforge /etc/appforge ! -user root)"
          test -z "$(find /opt/appforge /etc/appforge -perm /022 ! -type l)"
          # Sin terminal la TUI sale con 2; sin root, también.
          rc=0; appforge >/tmp/out 2>&1 || rc=$?; test "$rc" = 2; grep -q "terminal" /tmp/out
          rc=0; setpriv --reuid=nobody --regid=nogroup --clear-groups appforge >/tmp/out 2>&1 || rc=$?
          test "$rc" = 2; grep -q "superusuario" /tmp/out

      - name: Reinstalar, desinstalar y purgar
        run: |
          set -x
          echo "# cambio local" >> /etc/appforge/config.toml
          apt-get install -y --reinstall ./dist/appforge_*.deb
          grep -q "cambio local" /etc/appforge/config.toml   # conffile respetado
          apt-get remove -y appforge
          test ! -e /opt/appforge && test ! -e /usr/bin/appforge
          test -f /etc/appforge/config.toml                    # remove conserva la configuración
          apt-get purge -y appforge
          test ! -e /etc/appforge && test ! -e /var/log/appforge

  release:
    name: Publicar Release
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: v${{ needs.build.outputs.version }}
    steps:
      - name: Checkout (para las notas del CHANGELOG)
        uses: actions/checkout@v7

      - name: Notas de la versión desde CHANGELOG.md
        run: |
          awk -v v="${TAG#v}" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "Versión $TAG." > notes.md

      - name: Descargar el paquete
        uses: actions/download-artifact@v5
        with:
          name: appforge-deb
          path: dist

      - name: Procedencia del paquete (attestation)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/appforge_*.deb

      - name: Crear la Release con el paquete
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Si la etiqueta no existe (ejecución manual), se crea sobre este commit.
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AppForge $TAG" \
            --notes-file notes.md
