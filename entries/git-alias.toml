name = "Alias de git"
description = "Alias cortos de git (st, lg, amend...) para todos los usuarios"
category = "Desarrollo"
details = """
Copia una lista de alias a `/usr/local/etc/appforge/git-aliases.gitconfig` y la
incluye desde la configuración de git del sistema (`/etc/gitconfig`) con
`include.path`. La configuración de cada usuario no se toca.

| Alias | Equivale a |
|---|---|
| `git st` | `git status -sb` |
| `git lg` | `git log --graph --oneline --decorate --all` |
| `git amend` | `git commit --amend --no-edit` |
| `git unstage` | `git restore --staged` |

Desinstalar quita el fichero y la línea `include`.
"""

[check]
run = """
f=/usr/local/etc/appforge/git-aliases.gitconfig
test -f "$f" && git config --system --get-all include.path | grep -qxF "$f"
"""

[[step]]
title = "Instalar git"
run = "DEBIAN_FRONTEND=noninteractive apt-get install -y git"

[[step]]
title = "Copiar los alias"
copy = "aliases.gitconfig"
dest = "/usr/local/etc/appforge/git-aliases.gitconfig"
mode = "0644"

[[step]]
title = "Incluirlos en la configuración del sistema"
run = """
f=/usr/local/etc/appforge/git-aliases.gitconfig
git config --system --get-all include.path | grep -qxF "$f" \
  || git config --system --add include.path "$f"
"""

[remove]
run = """
f=/usr/local/etc/appforge/git-aliases.gitconfig
git config --system --fixed-value --unset-all include.path "$f" || true
rm -f "$f"
"""
