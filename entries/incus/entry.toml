name = "Incus (contenedores y VM)"
description = "Incus de Debian 13 inicializado, con tu usuario en incus-admin y la red abierta en ufw"
category = "Virtualización"

[[param]]
name = "vms"
prompt = "¿Soporte de máquinas virtuales? (yes | no)"
default = "yes"

[check]
run = """
command -v incus >/dev/null \
  && timeout 10 incus info >/dev/null 2>&1 \
  && timeout 10 incus network show incusbr0 >/dev/null 2>&1 \
  && { [ "$APPFORGE_USER" = root ] || id -nG "$APPFORGE_USER" | grep -qw incus-admin; }
"""

[[step]]
title = "Instalar Incus (y QEMU/OVMF para VM)"
script = "install-incus.sh"

[[step]]
title = "Inicializar Incus (si no lo está)"
run = """
if incus profile device get default root pool >/dev/null 2>&1; then
  echo "Incus ya está inicializado"
else
  incus admin init --minimal
fi
"""

[[step]]
title = "Añadir el usuario al grupo incus-admin"
run = """
if [ "$APPFORGE_USER" = root ]; then
  echo "root no necesita el grupo incus-admin"
else
  usermod -aG incus-admin "$APPFORGE_USER"
fi
"""

[[step]]
title = "Reglas de ufw para incusbr0 (si ufw está instalado)"
script = "ufw-rules.sh"

[remove]
# Conserva Incus, sus instancias, imágenes y almacenamiento.
run = """
if command -v ufw >/dev/null; then
  ufw delete allow in on incusbr0 || true
  ufw route delete allow in on incusbr0 || true
  ufw route delete allow out on incusbr0 || true
fi
if [ "$APPFORGE_USER" != root ]; then
  gpasswd -d "$APPFORGE_USER" incus-admin || true
fi
"""
