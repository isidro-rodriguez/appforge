name = "Docker Engine"
description = "Docker CE desde el repositorio oficial de Docker, con Buildx y Compose"
category = "Virtualización"

[check]
run = """
systemctl is-active --quiet docker && timeout 10 docker version >/dev/null 2>&1
"""

[[step]]
title = "Herramientas (curl, gpg)"
run = "DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl gpg"

[[step]]
title = "Clave del repositorio (huella verificada)"
script = "apt-key.sh"

[[step]]
title = "Repositorio de Docker (deb822)"
copy = "docker.sources"
dest = "/etc/apt/sources.list.d/docker.sources"
mode = "0644"

[[step]]
title = "Instalar Docker Engine"
run = """
apt-get update
DEBIAN_FRONTEND=noninteractive apt-get install -y \
  docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
systemctl enable --now docker
"""

[[step]]
title = "Añadir el usuario al grupo docker"
run = """
if [ "$APPFORGE_USER" = root ]; then
  echo "root no necesita el grupo docker"
else
  usermod -aG docker "$APPFORGE_USER"
fi
if systemctl is-active --quiet incus 2>/dev/null; then
  echo "Aviso: Incus está activo; Docker puede dejar sin red a sus instancias (política FORWARD)" >&2
fi
"""

[remove]
# Conserva /var/lib/docker (imágenes, contenedores, volúmenes) y /etc/docker.
run = """
DEBIAN_FRONTEND=noninteractive apt-get remove -y \
  docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin \
  docker-ce-rootless-extras || true
rm -f /etc/apt/sources.list.d/docker.sources /etc/apt/keyrings/docker.asc
apt-get update || true
"""
