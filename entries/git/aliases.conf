# Alias de git que instala la receta (git config --global alias.<nombre>).
# Formato: <nombre> <valor>; el valor es el resto de la línea.
# Ningún nombre puede coincidir con un comando de git: git ignoraría el alias.
st status -sb
a add
c commit
d diff
ds diff --staged
lg log --oneline --graph --decorate -20
p push
pl pull --ff-only
sw switch
bc bundle create
bundle-pull !f() { git bundle verify "$1" && git pull --ff-only "$1" "${2:-main}"; }; f
