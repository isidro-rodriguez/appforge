name = "Git y GitHub CLI"
description = "git, gh (repositorio oficial) y tu configuración global de git"
category = "Desarrollo"

[[param]]
name = "user_name"
prompt = "Nombre para los commits (user.name)"

[[param]]
name = "user_email"
prompt = "Email para los commits (user.email)"

[[param]]
name = "default_branch"
prompt = "Rama inicial de los repositorios nuevos"
default = "main"

[[param]]
name = "editor"
prompt = "Editor de git (core.editor; - = no cambiar)"
default = "-"

[check]
# El email no tiene valor por defecto: se comprueba que esté configurado.
run = """
command -v git >/dev/null && command -v gh >/dev/null \
  && HOME="$APPFORGE_USER_HOME" git config --global --get user.email | grep -q '@'
"""

[[step]]
title = "Instalar git y herramientas (curl, gpg)"
run = "DEBIAN_FRONTEND=noninteractive apt-get install -y git ca-certificates curl gpg"

[[step]]
title = "Clave del repositorio de GitHub CLI (huella verificada)"
script = "apt-key.sh"

[[step]]
title = "Repositorio de GitHub CLI (deb822)"
copy = "github-cli.sources"
dest = "/etc/apt/sources.list.d/github-cli.sources"
mode = "0644"

[[step]]
title = "Instalar GitHub CLI"
run = """
apt-get update
DEBIAN_FRONTEND=noninteractive apt-get install -y gh
"""

[[step]]
title = "Configuración global de git del usuario"
script = "git-config.sh"

[remove]
# Conserva git y el ~/.gitconfig del usuario.
run = """
DEBIAN_FRONTEND=noninteractive apt-get remove -y gh || true
rm -f /etc/apt/sources.list.d/github-cli.sources /etc/apt/keyrings/githubcli-archive-keyring.gpg
apt-get update || true
"""
