# .pre-commit-config.yaml
# Configuración de pre-commit del proyecto.
# pre-commit: comprobaciones rápidas (formato, lint, tipos, tests sin cobertura).
# pre-push:   suite completa con cobertura.
# Todos los hooks son locales y usan `uv run`, así que las versiones de las
# herramientas salen siempre de `uv.lock`.

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff (formato)
        entry: uv run ruff format
        language: system
        types: [python]
        stages: [pre-commit]

      - id: ruff
        name: ruff (lint)
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
        stages: [pre-commit]

      - id: ty
        name: ty (tipos)
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]

      # Suite completa sin cobertura al hacer commit.
      - id: pytest
        name: pytest (sin cobertura)
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Suite completa con cobertura al hacer push.
      - id: pytest-cov
        name: pytest (con cobertura)
        entry: uv run pytest --cov=src --cov-report=term-missing
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
