[project]
name = "appforge"
version = "0.12.1"
description = "Lanzador de recetas de configuración con menú de consola"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

dependencies = [
    "acodo>=0.4,<1",
    "textual>=8,<9",
    "typer>=0.20,<1",
]

[project.scripts]
appforge = "appforge.main:main"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "ty>=0.0.94",
]
docs = [
    "mkdocstrings-python>=2.0.10",
    "zensical>=0.0.73",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.14.0"]
build-backend = "uv_build"

# --- pytest coverage ---------------------------------------------------------
[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_also = ["pragma: no cover", "if TYPE_CHECKING:", "if __name__ == .__main__.:"]

# --- Poe the Poet (opcional) -------------------------------------------------
# Atajos para quien tenga `poe` instalado globalmente (`uv tool install poethepoet`).
# No es dependencia del proyecto: todo se puede ejecutar también con `uv run`.
[tool.poe]
executor.type = "uv"

[tool.poe.tasks.check]
help = "Formato, lint, tipos y tests (lo mismo que la CI)"
sequence = [
  "ruff format --check .",
  "ruff check .",
  "ty check",
  "pytest",
]
default_item_type = "cmd"

[tool.poe.tasks.fix]
help = "Aplica el formato y las correcciones automáticas de Ruff"
sequence = ["ruff format .", "ruff check --fix ."]
default_item_type = "cmd"

[tool.poe.tasks.backup]
help = "Copia de seguridad del repositorio con git bundle"
cmd = "python scripts/backup.py"

[tool.poe.tasks.build]
help = "Binario PyInstaller, config y entradas en dist/ (carpeta y .tar.gz)"
cmd = "python scripts/build.py"

[tool.poe.tasks.screenshots]
help = "Capturas SVG de la TUI para la documentación"
cmd = "python scripts/screenshots.py"

[tool.poe.tasks.docs]
help = "Vista previa de la documentación en http://localhost:8000"
cmd = "uv run --group docs zensical serve"

# --- pytest ------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib", "--doctest-modules"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# --- Astral Ruff -------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "PERF", "PTH", "RUF", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["appforge"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

# --- Astral ty ---------------------------------------------------------------
[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src", "tests"]

[tool.uv.build-backend]
module-name = "appforge"
